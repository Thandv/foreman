name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite creates worktrees and commits; git needs an identity to do so.
      - run: |
          git config --global user.name "foreman-ci"
          git config --global user.email "foreman-ci@users.noreply.github.com"
      - name: typecheck + tests
        run: npm run verify
